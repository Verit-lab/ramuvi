# Classroom profile (scripts/arena.sh): only the frontend is reachable on the
# LAN; database and backend stay inside the Compose network. Services restart
# with the machine (laptop reboot between lessons).
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  backend:
    ports: !reset []
    # Sala LAN requer origem explícita; nunca reutilizar esse padrão no perfil prod.
    environment:
      APP_ALLOWED_ORIGIN_PATTERNS: ${CLASSROOM_ALLOWED_ORIGIN_PATTERNS:-http://*:[3000]}
    restart: unless-stopped
  frontend:
    ports: !override
      - "${CLASSROOM_FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
